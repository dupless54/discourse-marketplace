marketplace:
  marketplace_enabled:
    client: true
    default: false
  marketplace_min_trust_level:
    client: true
    default: 1
    min: 0
    max: 4
  marketplace_allowed_currencies:
    client: true
    default: "TRY|EUR|USD|GBP"
    type: list
    list_type: compact
  marketplace_offer_expiry_hours:
    default: 48
    min: 1
    max: 168
