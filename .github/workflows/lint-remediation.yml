name: Marketplace lint remediation

on:
  push:
    branches:
      - ci/enable-discourse-linting
    paths:
      - .github/workflows/lint-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/enable-discourse-linting

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Enable pnpm
        run: corepack enable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Ruby lint dependencies
        run: bundle install

      - name: Apply reported RuboCop remediations
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              file.write_text(text.replace(old, new, count))

          path = "app/models/marketplace/category_field_definition.rb"
          replace(
              path,
              """      values = []\n      choices.each do |choice|\n        if !choice.is_a?(Hash) || choice.keys.map(&:to_s).sort != %w[label value]\n          errors.add(:choices, :invalid)\n          return\n        end\n\n        value = choice[\"value\"] || choice[:value]\n        label = choice[\"label\"] || choice[:label]\n        if !value.is_a?(String) || !value.match?(CHOICE_VALUE_FORMAT) ||\n             value.length > MAX_CHOICE_VALUE_LENGTH || !label.is_a?(String) || label.blank? ||\n             label.length > MAX_CHOICE_LABEL_LENGTH\n          errors.add(:choices, :invalid)\n          return\n        end\n\n        values << value\n      end\n\n      errors.add(:choices, :taken) if values.uniq.length != values.length\n""",
              """      values = []\n      invalid_choice = false\n      choices.each do |choice|\n        if !choice.is_a?(Hash) || choice.keys.map(&:to_s).sort != %w[label value]\n          errors.add(:choices, :invalid)\n          invalid_choice = true\n          break\n        end\n\n        value = choice[\"value\"] || choice[:value]\n        label = choice[\"label\"] || choice[:label]\n        if !value.is_a?(String) || !value.match?(CHOICE_VALUE_FORMAT) ||\n             value.length > MAX_CHOICE_VALUE_LENGTH || !label.is_a?(String) || label.blank? ||\n             label.length > MAX_CHOICE_LABEL_LENGTH\n          errors.add(:choices, :invalid)\n          invalid_choice = true\n          break\n        end\n\n        values << value\n      end\n      return if invalid_choice\n\n      errors.add(:choices, :taken) if values.uniq.length != values.length\n""",
          )

          replace(
              "spec/lib/marketplace/listing_query_dynamic_filters_spec.rb",
              'describe Marketplace::ListingQuery, "dynamic structured filters" do',
              'describe Marketplace::ListingQuery, "#results" do',
          )
          replace(
              "spec/lib/marketplace/locale_spec.rb",
              'describe "Marketplace locale files" do',
              "describe Marketplace do",
          )
          replace(
              "spec/services/marketplace/listings/structured_fields_spec.rb",
              'describe "Marketplace listing structured fields" do',
              "describe Marketplace::Listing do",
          )

          replacements = {
              "spec/lib/marketplace/trade_contract_spec.rb": [
                  ("expect(info.completed_at).to eq(transaction.completed_at)", "expect(info.completed_at).to eq_time(transaction.completed_at)"),
                  ("expect(info.completed_at).not_to eq(transaction.completed_at)", "expect(info.completed_at).not_to eq_time(transaction.completed_at)"),
              ],
              "spec/services/marketplace/listings/create_spec.rb": [
                  ("expect(result.listing.expires_at).to eq(expires_at)", "expect(result.listing.expires_at).to eq_time(expires_at)"),
              ],
              "spec/services/marketplace/listings/update_spec.rb": [
                  ("expect(result.listing.expires_at).to eq(expires_at)", "expect(result.listing.expires_at).to eq_time(expires_at)"),
              ],
              "spec/services/marketplace/transactions/cancel_spec.rb": [
                  ("expect(cancelled.buyer_confirmed_at).to eq(original_buyer_confirmed_at)", "expect(cancelled.buyer_confirmed_at).to eq_time(original_buyer_confirmed_at)"),
                  ("expect(second.transaction.cancelled_at).to eq(first.transaction.cancelled_at)", "expect(second.transaction.cancelled_at).to eq_time(first.transaction.cancelled_at)"),
              ],
              "spec/services/marketplace/transactions/confirm_spec.rb": [
                  ("expect(completed.buyer_confirmed_at).to eq(completed.completed_at)", "expect(completed.buyer_confirmed_at).to eq_time(completed.completed_at)"),
                  ("expect(listing.closed_at).to eq(completed.completed_at)", "expect(listing.closed_at).to eq_time(completed.completed_at)"),
                  ("expect(completed.seller_confirmed_at).to eq(completed.completed_at)", "expect(completed.seller_confirmed_at).to eq_time(completed.completed_at)"),
                  ("expect(second.transaction.buyer_confirmed_at).to eq(first.transaction.buyer_confirmed_at)", "expect(second.transaction.buyer_confirmed_at).to eq_time(first.transaction.buyer_confirmed_at)"),
                  ("expect(second.transaction.seller_confirmed_at).to eq(first.transaction.seller_confirmed_at)", "expect(second.transaction.seller_confirmed_at).to eq_time(first.transaction.seller_confirmed_at)"),
                  ("expect(result.transaction.buyer_confirmed_at).to eq(original_buyer_confirmed_at)", "expect(result.transaction.buyer_confirmed_at).to eq_time(original_buyer_confirmed_at)"),
              ],
          }

          for file, pairs in replacements.items():
              for old, new in pairs:
                  count = 3 if file.endswith("cancel_spec.rb") and "cancelled_at" in old else 1
                  if file.endswith("confirm_spec.rb") and old == "expect(listing.closed_at).to eq(completed.completed_at)":
                      count = 2
                  replace(file, old, new, count=count)

          replace(
              "spec/services/marketplace/transactions/confirm_spec.rb",
              """      expect(DiscourseEvent).to receive(:trigger).with(\n        :marketplace_transaction_completed,\n        transaction.id,\n        continue_on_error: true,\n      )\n\n      call_service(guardian: buyer.guardian, transaction_id: transaction.id)\n""",
              """      allow(DiscourseEvent).to receive(:trigger)\n\n      call_service(guardian: buyer.guardian, transaction_id: transaction.id)\n\n      expect(DiscourseEvent).to have_received(:trigger).with(\n        :marketplace_transaction_completed,\n        transaction.id,\n        continue_on_error: true,\n      )\n""",
          )

      - name: Apply official Stylelint fixes
        run: pnpm lint:css:fix

      - name: Apply official Prettier fixes
        run: pnpm lint:prettier:fix

      - name: Apply Syntax Tree formatting
        run: bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')

      - name: Validate JavaScript lint
        run: pnpm lint:js --max-warnings 0

      - name: Validate Stylelint
        run: pnpm lint:css

      - name: Validate Prettier
        run: pnpm lint:prettier

      - name: Validate types
        run: pnpm lint:types

      - name: Validate RuboCop
        run: bundle exec rubocop .

      - name: Validate Syntax Tree
        run: bundle exec stree check Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remediation changes"
          else
            git commit -m "DEV: satisfy official Discourse lint gates"
            git push origin HEAD:ci/enable-discourse-linting
          fi
