name: Marketplace lint maintenance

on:
  push:
    branches:
      - ci/enable-discourse-linting
    paths:
      - .github/workflows/maintenance-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/enable-discourse-linting

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Enable pnpm
        run: corepack enable

      - name: Generate pnpm lock
        run: pnpm install --lockfile-only

      - name: Install Ruby lint dependencies
        run: bundle install

      - name: Apply official RuboCop autocorrections
        run: bundle exec rubocop -A . || true

      - name: Apply Syntax Tree formatting
        run: bundle exec stree write Gemfile $(git ls-files '*.rb') $(git ls-files '*.rake') $(git ls-files '*.thor')

      - name: Commit generated maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml Gemfile '*.rb' '*.rake' '*.thor'
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "DEV: apply official Discourse lint maintenance"
            git push origin HEAD:ci/enable-discourse-linting
          fi
